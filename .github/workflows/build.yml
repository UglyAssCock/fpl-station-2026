name: Build FPL 2026/27 Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Folder Safely
        run: |
          mkdir -p /tmp/backup_fpl
          cp pubspec.yaml /tmp/backup_fpl/
          cp -r lib /tmp/backup_fpl/
          mkdir -p assets/images
          flutter create --org com.stationfootball.fpl26 --project-name fpl_station_2026 .
          cp /tmp/backup_fpl/pubspec.yaml .
          rm -rf lib
          cp -r /tmp/backup_fpl/lib .
          rm -rf test

      - name: Configure Android minSdk 21+ and Internet Permission
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/minSdk .*/minSdk = 21/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle.kts
          fi
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpl-station-2026-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
